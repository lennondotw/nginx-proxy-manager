name: Public ports image

on:
  push:
    branches: [homelab]
  pull_request:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Validate runtime configuration
        run: node --test backend/lib/public-ports.test.js
      - name: Build and test the manager
        run: |
          yarn --cwd frontend install --frozen-lockfile
          yarn --cwd frontend vitest run src/components/Table/Formatter/DomainsFormatter.test.tsx
          yarn --cwd frontend locale-compile
          yarn --cwd frontend build
      - name: Build the amd64 image
        run: |
          docker build --platform linux/amd64 -f docker/Dockerfile.public-ports \
            --build-arg BUILD_COMMIT="$GITHUB_SHA" -t public-ports:test .
      - name: Verify Nginx and the runtime API
        run: python3 test/public-ports-smoke.py public-ports:test
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/homelab'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/homelab'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag public-ports:test "$IMAGE:2.16.0-public-ports"
          docker tag public-ports:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:2.16.0-public-ports"
